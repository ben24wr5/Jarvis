name: Build OLED

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build OLED.app and OLED.dmg
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x scripts/build_app.sh
          set +e
          ./scripts/build_app.sh 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface each compiler error as an annotation so it is easy to read.
            grep -E "error:|Error:|No such file|command not found" build.log | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -15 build.log | while IFS= read -r line; do echo "::warning::$line"; done
          fi
          exit $status

      - name: Publish OLED.dmg as the latest release
        # Only publish once the real app icon has been added.
        if: hashFiles('Resources/AppIcon.png') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/OLED.dmg \
            --title "OLED – latest build (#${{ github.run_number }})" \
            --notes "Download OLED.dmg, open it, and drag OLED into Applications." \
            --latest
